name: Release

# Tag pushes only. A pull request — from a fork or otherwise — never matches this workflow, so `secrets.*` below are
# unreachable from fork PR code. The repository guard on the job is the second lock: a tag pushed inside somebody's
# fork runs in that fork with that fork's own (empty) secrets, and this `if` stops it before it can publish anything.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    if: github.repository == 'ntainy/open-guitar-tuner'
    permissions:
      contents: write # create the GitHub Release and upload the APK to it

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Derive version from the tag
        id: version
        run: |
          set -euo pipefail
          # refs/tags/v0.2 -> 0.2
          version_name="${GITHUB_REF_NAME#v}"
          echo "name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "Building ${version_name} (versionCode ${GITHUB_RUN_NUMBER})"

      # RUNNER_TEMP is outside the checkout, so the keystore can never be swept up by a workspace glob.
      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::secrets.ANDROID_KEYSTORE_BASE64 is not set — refusing to publish an unsigned release."
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"

      - name: Assemble the signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :dsp:test :app:testDebugUnitTest assembleRelease

      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          # An unconfigured build would have emitted app-release-unsigned.apk instead.
          test -f "$apk" || { echo "::error::$apk is missing — the build produced an unsigned APK."; exit 1; }
          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk"

      - name: Shred the keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk \
             "OpenGuitarTuner-${{ steps.version.outputs.name }}.apk"
          gh release create "${GITHUB_REF_NAME}" \
            --title "OpenGuitarTuner ${{ steps.version.outputs.name }}" \
            --generate-notes \
            "OpenGuitarTuner-${{ steps.version.outputs.name }}.apk"
